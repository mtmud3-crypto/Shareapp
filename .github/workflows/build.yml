name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate android folder
        run: |
          flutter create --platforms=android --org com.example --project-name shareapp /tmp/gen
          cp -r /tmp/gen/android ./android
      - name: Patch permissions and minSdk
        run: python3 patch.py
      - run: flutter pub get
      - name: Fix device_apps plugin
        run: |
          python3 - <<'PY'
          import glob, re
          base = '/home/runner/.pub-cache/hosted/pub.dev/device_apps-*/android/'
          for f in glob.glob(base + 'build.gradle'):
              s = open(f).read()
              s = s.replace('jcenter()', 'mavenCentral()')
              s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 34', s)
              if 'namespace' not in s:
                  s = re.sub(r'android\s*\{', 'android {\n    namespace "fr.g123k.deviceapps"', s, 1)
              open(f, 'w').write(s)
          for m in glob.glob(base + 'src/main/AndroidManifest.xml'):
              t = open(m).read()
              t = re.sub(r'\s+package="[^"]*"', '', t, 1)
              open(m, 'w').write(t)
          PY
      - name: Force compileSdk 36
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
          }
          EOF
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: shareapp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
