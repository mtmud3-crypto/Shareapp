name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate android folder
        run: |
          flutter create --platforms=android --org com.example --project-name shareapp /tmp/gen
          cp -r /tmp/gen/android ./android
      - name: Patch permissions and minSdk
        run: python3 patch.py
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: shareapp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
